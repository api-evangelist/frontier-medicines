name: Frontier Medicines
description: >-
  Frontier Medicines is a clinical-stage biopharmaceutical company pioneering
  the discovery and development of small-molecule covalent drugs against
  disease-causing proteins long considered undruggable. Its proprietary Frontier
  Platform pairs chemoproteomics with artificial intelligence and machine
  learning and a proprietary Druggability Atlas that maps thousands of novel
  covalent binding opportunities across the human proteome. Lead precision
  oncology candidates include FMC-376 (KRAS G12C), FMC-220 (a p53 Y220C
  reactivator), and FMC-242 (PI3Kalpha-RAS). Founded in 2018 with offices in
  Boston, Massachusetts and South San Francisco, California, the company is
  backed by DCVC and other life-science investors. Frontier Medicines was added
  to the API Evangelist network as a DCVC portfolio company; it publishes no
  public API or developer surface, so this profile captures company identity
  only.
